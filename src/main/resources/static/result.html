<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <title>결제 처리 중</title>
</head>

<body>
<h2>결제 처리 중입니다...</h2>

<script>
    //현재 페이지 주소 window.location, 뒤에 search를 통해 ? 뒤 값들 가져옴.
    const urlParams = new URLSearchParams(window.location.search);

    //성공 응답 파라미터
    const paymentKey = urlParams.get("paymentKey");
    const orderId = urlParams.get("orderId");
    const amount = urlParams.get("amount");
    //직접 붙인 파라미터
    const idempotencyKey = urlParams.get("idempotencyKey");

    //실패 응답 파라미터
    const errorCode = urlParams.get("code");
    const errorMessage = urlParams.get("message");



    //성공 응답
    async function confirmPayment() {

        try {
            await fetch("/payments/confirm", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                },
                body: JSON.stringify({
                    paymentKey,
                    orderId,
                    amount,
                    idempotencyKey
                }),
            });


            // 성공 응답이더라도 order_detail 페이지애서 상태 확인후 상태 확정
            window.location.href = `/orders/${orderId}/detail?idempotencyKey=${idempotencyKey}`;

        } catch (e) {
            console.error("네트워크 오류", e);

            // 어떤 경우든 상태 페이지에서 확인
            window.location.href = `/orders/${orderId}/detail?idempotencyKey=${idempotencyKey}`;
        }
    }

    function handleFail() {
        console.error("실패 응답:", errorCode, errorMessage);

        window.location.href =
            `/orders/${orderId}/detail?idempotencyKey=${idempotencyKey}`
    }

    function init() {
        // 1. 성공 케이스 (paymentKey 존재)
        if (paymentKey) {
            confirmPayment();
            return;
        }

        // 2. 실패 케이스 (code 존재)
        if (errorCode) {
            handleFail();
            return;
        }

        // 3. 예외 케이스 (파라미터 이상)
        console.error("알 수 없는 결제 상태", {
            paymentKey,
            errorCode
        });

        window.location.href =
            `/orders/${orderId}/detail?idempotencyKey=${idempotencyKey}`;
    }

    init();
</script>

</body>
</html>
